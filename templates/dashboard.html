<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live API Traffic Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen p-8">
    <div class="max-w-7xl mx-auto">
        <header class="flex justify-between items-center border-b border-slate-700 pb-4 mb-6">
            <div>
                <h1 class="text-3xl font-bold text-emerald-400">Classroom Live API Monitor</h1>
                <div class="flex items-center gap-3 mt-1">
                    <p class="text-slate-400 text-sm">Real-time student request log</p>
                    <span id="auth-badge" class="px-2 py-0.5 rounded text-[10px] font-bold uppercase border"></span>
                </div>
            </div>
            <div class="flex gap-3">
                <button onclick="toggleSecurity()" class="bg-amber-600 hover:bg-amber-500 text-white py-2 px-4 rounded text-sm font-bold transition">
                    🔄 Toggle Security
                </button>
                <a href="/docs" target="_blank" class="bg-slate-700 hover:bg-slate-600 text-white py-2 px-4 rounded text-sm transition">Swagger Docs</a>
            </div>
        </header>

        <!-- HTTP Stream -->
        <section class="bg-slate-800 p-6 rounded-lg border border-slate-700 shadow-xl mb-6">
            <h2 class="text-xl font-semibold text-slate-200 mb-4">⚡ HTTP Stream</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead>
                        <tr class="border-b border-slate-700 text-slate-400">
                            <th class="pb-3 pr-4">Time</th>
                            <th class="pb-3 pr-4">IP</th>
                            <th class="pb-3 pr-4">Action</th>
                            <th class="pb-3 pr-4">Status</th>
                            <th class="pb-3">Details</th>
                        </tr>
                    </thead>
                    <tbody id="log-table-body" class="divide-y divide-slate-700/50"></tbody>
                </table>
            </div>
        </section>

        <!-- Book Catalogue -->
        <section class="bg-slate-800 p-6 rounded-lg border border-slate-700 shadow-xl">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold text-slate-200">📚 Book Catalogue <span id="book-count" class="text-sm text-slate-400 font-normal ml-2"></span></h2>
                <input id="search" type="text" placeholder="Filter by title, author or DDC…"
                    class="bg-slate-700 border border-slate-600 text-slate-200 text-sm rounded px-3 py-1.5 w-64 focus:outline-none focus:border-emerald-500"
                    oninput="renderBooks()">
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead>
                        <tr class="border-b border-slate-700 text-slate-400 text-xs uppercase tracking-wide">
                            <th class="pb-3 pr-4">ID</th>
                            <th class="pb-3 pr-4">Title</th>
                            <th class="pb-3 pr-4">Author</th>
                            <th class="pb-3 pr-4">DDC</th>
                            <th class="pb-3 pr-4">ISBN</th>
                            <th class="pb-3 pr-4 text-right">Retail (NZD)</th>
                            <th class="pb-3 pr-4 text-right">2nd Hand (NZD)</th>
                            <th class="pb-3 pr-4 text-right">Saving</th>
                            <th class="pb-3 text-center">Status</th>
                        </tr>
                    </thead>
                    <tbody id="book-table-body" class="divide-y divide-slate-700/50"></tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        let allBooks = [];
        let lastLogsJson = '';
        let lastAuthStatus = null;

        async function toggleSecurity() {
            try {
                await fetch('/admin/toggle-auth', { method: 'POST' });
            } catch (err) {
                alert("Error toggling security.");
            }
        }

        function renderBooks() {
            const query = document.getElementById('search').value.toLowerCase();
            const filtered = allBooks.filter(b =>
                b.title.toLowerCase().includes(query) ||
                (b.description || '').toLowerCase().includes(query) ||
                (b.dewey_decimal || '').toLowerCase().includes(query)
            );
            document.getElementById('book-count').textContent = `(${filtered.length} of ${allBooks.length})`;
            document.getElementById('book-table-body').innerHTML = filtered.map(book => {
                const saving = book.retail_price && book.secondhand_price
                    ? (book.retail_price - book.secondhand_price).toFixed(2)
                    : '—';
                const savingPct = book.retail_price && book.secondhand_price
                    ? Math.round((1 - book.secondhand_price / book.retail_price) * 100)
                    : null;
                return `
                    <tr class="hover:bg-slate-700/20 transition text-xs">
                        <td class="py-2 pr-4 text-slate-500">${book.id}</td>
                        <td class="py-2 pr-4 font-medium text-slate-100">${book.title}</td>
                        <td class="py-2 pr-4 text-slate-400">${book.description || '—'}</td>
                        <td class="py-2 pr-4 font-mono text-sky-400">${book.dewey_decimal || '—'}</td>
                        <td class="py-2 pr-4 font-mono text-slate-500 text-[10px]">${book.isbn || '—'}</td>
                        <td class="py-2 pr-4 text-right text-slate-200">$${book.retail_price?.toFixed(2) ?? '—'}</td>
                        <td class="py-2 pr-4 text-right text-emerald-400">$${book.secondhand_price?.toFixed(2) ?? '—'}</td>
                        <td class="py-2 pr-4 text-right text-amber-400">${savingPct !== null ? `$${saving} (${savingPct}%)` : '—'}</td>
                        <td class="py-2 text-center">
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold ${book.completed ? 'bg-emerald-900/50 text-emerald-300' : 'bg-amber-900/40 text-amber-400'}">
                                ${book.completed ? 'LOANED' : 'IN STOCK'}
                            </span>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function fetchUpdates() {
            try {
                const res = await fetch('/v1/internal/state');
                const data = await res.json();

                // Auth badge — only update if changed
                if (data.auth_status !== lastAuthStatus) {
                    lastAuthStatus = data.auth_status;
                    const badge = document.getElementById('auth-badge');
                    badge.innerText = data.auth_status ? "Security: LOCKED (401)" : "Security: OPEN (200)";
                    badge.className = data.auth_status
                        ? "px-2 py-0.5 rounded text-[10px] font-bold uppercase bg-rose-900/50 text-rose-300 border border-rose-700"
                        : "px-2 py-0.5 rounded text-[10px] font-bold uppercase bg-emerald-900/50 text-emerald-300 border border-emerald-700";
                }

                // Books — only update on first load (books rarely change live)
                if (allBooks.length === 0) {
                    allBooks = data.db;
                    renderBooks();
                }

                // Logs — only re-render if the log data changed
                const logsJson = JSON.stringify(data.logs);
                if (logsJson !== lastLogsJson) {
                    lastLogsJson = logsJson;
                    document.getElementById("log-table-body").innerHTML = data.logs.map(log => {
                        const statusColor = log.status >= 400 ? 'text-rose-400' : 'text-emerald-400';
                        return `
                            <tr class="hover:bg-slate-700/20 transition">
                                <td class="py-3 pr-4 text-slate-500">${log.time}</td>
                                <td class="py-3 pr-4 font-mono text-slate-300">${log.ip}</td>
                                <td class="py-3 pr-4 font-bold text-blue-400">${log.action}</td>
                                <td class="py-3 pr-4 font-bold ${statusColor}">${log.status}</td>
                                <td class="py-3 text-slate-400">${log.details}</td>
                            </tr>
                        `;
                    }).join('');
                }
            } catch (err) { console.error(err); }
        }

        setInterval(fetchUpdates, 1000);
        fetchUpdates();
    </script>
</body>
</html>
